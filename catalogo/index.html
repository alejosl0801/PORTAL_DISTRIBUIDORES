<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo PyroShield</title>
<meta name="description" content="Mira lo que tenemos disponible en stock, siempre actualizado.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo PyroShield">
<meta property="og:description" content="Mira lo que tenemos disponible en stock, siempre actualizado.">
<meta property="og:url" content="https://pyroshield.online/catalogo/">
<meta property="og:image" content="https://pyroshield.online/img/logo.jpg">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif}
  #promo{position:fixed;inset:0;display:none;flex-direction:column;background:#0b0b0b}
  #marco{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #marco img{max-width:100%;max-height:100%;object-fit:contain}
  #barra{flex:none;padding:10px 16px 14px;background:#0b0b0b;text-align:center}
  #cuenta{font-size:15px;font-weight:bold;letter-spacing:.3px}
  #cuenta span{color:#ffb703}
  #ir{display:inline-block;margin-top:8px;padding:9px 22px;background:#c1121f;color:#fff;border-radius:6px;text-decoration:none;font-weight:bold;font-size:15px}
  #progreso{position:fixed;left:0;bottom:0;height:4px;width:0;background:#c1121f}
  #espera{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
</style>
</head>
<body>
<div id="espera">Abriendo el catálogo…</div>
<div id="promo">
  <div id="marco"><img id="foto" alt="Promoción vigente"></div>
  <div id="barra">
    <div id="cuenta"></div>
    <a id="ir" href="#">Ver catálogo →</a>
  </div>
  <div id="progreso"></div>
</div>
<script>
(function () {
  // A dónde va el catálogo al terminar la promo
  var PDF_URL = "https://www.dropbox.com/scl/fi/qbebbw1r7gtl0alem8v8e/CATALOGO_PYROSHIELD.pdf?rlkey=tly6yx1bo86te1jetuuktj6gr&st=exk2svar&raw=1";
  var SEGUNDOS = 3;

  // Promociones vigentes (hora de Ecuador, UTC-5). Solo se muestra la que corresponde a hoy.
  var OLAS = [
    { ini: "2026-11-07T00:00:00-05:00", fin: "2026-11-10T23:59:59-05:00", foto: "promos/ola2.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-11T00:00:00-05:00", fin: "2026-11-13T23:59:59-05:00", foto: "promos/ola3.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-14T00:00:00-05:00", fin: "2026-11-17T23:59:59-05:00", foto: "promos/ola4.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-18T00:00:00-05:00", fin: "2026-11-20T23:59:59-05:00", foto: "promos/ola5.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-21T00:00:00-05:00", fin: "2026-11-24T23:59:59-05:00", foto: "promos/ola6.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-25T00:00:00-05:00", fin: "2026-11-27T23:59:59-05:00", foto: "promos/ola7.jpg", texto: "Esta ola termina en" },
    { ini: "2026-11-28T00:00:00-05:00", fin: "2026-11-30T23:59:59-05:00", foto: "promos/final-sab28.jpg", texto: "El Gran Final termina en" },
    { ini: "2026-11-29T00:00:00-05:00", fin: "2026-11-30T23:59:59-05:00", foto: "promos/final-dom29.jpg", texto: "El Gran Final termina en" },
    { ini: "2026-11-30T00:00:00-05:00", fin: "2026-11-30T23:59:59-05:00", foto: "promos/final-lun30.jpg", texto: "El Gran Final termina en" }
  ];

  var q = new URLSearchParams(location.search);
  var ahora = q.get("fecha") ? new Date(q.get("fecha")) : new Date();   // ?fecha=... solo para probar
  var pausa = q.get("pausa") === "1";                                   // ?pausa=1 no redirige (para probar)

  function irAlCatalogo() { location.replace(PDF_URL); }

  var vigente = null;
  for (var i = OLAS.length - 1; i >= 0; i--) {
    if (ahora >= new Date(OLAS[i].ini) && ahora <= new Date(OLAS[i].fin)) { vigente = OLAS[i]; break; }
  }
  if (!vigente) { irAlCatalogo(); return; }        // sin promo vigente: directo al catálogo

  var t0 = Date.now();
  var fin = new Date(vigente.fin).getTime();
  var desfase = ahora.getTime() - Date.now();
  document.getElementById("ir").href = PDF_URL;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function pintarCuenta() {
    var ms = fin - (Date.now() + desfase);
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60;
    var partes = (d > 0 ? d + "d " : "") + pad(h) + "h " + pad(m) + "m " + pad(seg) + "s";
    document.getElementById("cuenta").innerHTML = vigente.texto + " <span>" + partes + "</span>";
  }

  var foto = document.getElementById("foto");
  foto.onerror = irAlCatalogo;                       // si la imagen falla, directo al catálogo
  foto.onload = function () {
    document.getElementById("espera").style.display = "none";
    document.getElementById("promo").style.display = "flex";
    pintarCuenta();
    setInterval(pintarCuenta, 1000);
    if (pausa) return;
    var barra = document.getElementById("progreso");
    barra.style.transition = "width " + SEGUNDOS + "s linear";
    requestAnimationFrame(function () { requestAnimationFrame(function () { barra.style.width = "100%"; }); });
    setTimeout(irAlCatalogo, SEGUNDOS * 1000);
  };
  foto.src = vigente.foto;
})();
</script>
</body>
</html>
