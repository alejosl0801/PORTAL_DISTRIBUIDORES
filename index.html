<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>PyroShield</title>

<meta http-equiv="refresh" content="0; url=/catalogo/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center}
  a{display:inline-block;margin-top:16px;padding:12px 22px;background:#c1121f;color:#fff;border-radius:6px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div>
  <h1>PyroShield</h1>
  <p>Abriendo el catálogo…</p>
  <a href="/catalogo/">Ver catálogo</a>
</div>
<script>
  // Quita el portal anterior de los navegadores que lo tenían guardado, y va al catálogo.
  (function () {
    function ir() { location.replace('/catalogo/'); }
    var tareas = [];
    if ('serviceWorker' in navigator) {
      tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches) {
      tareas.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    Promise.all(tareas).then(ir, ir);
    setTimeout(ir, 1500);
  })();
</script>
</body>
</html>
